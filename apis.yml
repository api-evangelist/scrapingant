aid: scrapingant
name: ScrapingAnt
description: ScrapingAnt is a web-data infrastructure platform operated by DATAANT that puts headless
  Chrome rendering, a rotating pool of 3M+ residential and datacenter proxies, CAPTCHA avoidance and AI-powered
  extraction behind a single HTTP API. One request returns a fully JavaScript-rendered page as raw HTML,
  as LLM-ready Markdown, as an extended JSON envelope carrying cookies, headers, XHRs and iframes, or
  as structured JSON described in plain English. A hosted, remote MCP server exposes three of those formats
  as native tools to Claude, Cursor, Windsurf, Cline and VS Code, so an AI agent gets live web access
  without running a browser locally. Billing is metered in API credits with a permanently free 10,000-credit
  monthly tier; standalone rotating proxies are sold separately by bandwidth.
