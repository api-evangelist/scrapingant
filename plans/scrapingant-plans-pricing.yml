specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: ScrapingAnt
providerId: scrapingant
generated: '2026-08-29'
method: searched
source: >-
  https://scrapingant.com/#pricing (API credit plans),
  https://scrapingant.com/residential-proxies (residential bandwidth tiers),
  https://docs.scrapingant.com/credits-cost (credit cost table)
created: '2026-05-04'
modified: '2026-08-29'
tags:
  - Data Extraction
  - Proxies
  - Scraping
description: >-
  ScrapingAnt's published pricing, read from the provider's own pricing surfaces on 2026-08-29.
  This file REPLACES a 2026-05-04 scaffold whose tier names, quotas and prices were placeholder
  values invented by a bulk sweep - none of them matched what ScrapingAnt actually sells.
  ScrapingAnt bills two separate products on two separate meters: the API (monthly pools of
  "API credits", where one request costs 1-125 credits depending on browser and proxy options)
  and standalone rotating proxies (billed per GB of bandwidth, not per request).
plan_count: 6
proxy_plan_count: 8
billing:
  primary_meter: api_credits
  currency: USD
  period: month
  rollover: false
  rollover_note: >-
    Unused API credits are not carried into the next subscription period
    (docs.scrapingant.com/credits-cost).
  failed_request_policy: Failed requests cost 0 credits.
  mid_cycle_reset: >-
    A plan can be restarted instantly mid-month rather than waiting for the next billing cycle;
    credits refresh on payment.
credit_costs:
  source: https://docs.scrapingant.com/credits-cost
  unit: api_credit
  response_header: Ant-credits-cost
  table:
    - request: Simple request (no browser) + datacenter proxy
      credits: 1
    - request: Headless browser, no JS rendering (return_page_source=true) + datacenter proxy
      credits: 2
    - request: Headless browser with JS rendering + datacenter proxy
      credits: 10
    - request: Simple request (no browser) + residential proxy
      credits: 25
    - request: Headless browser, no JS rendering (return_page_source=false) + datacenter proxy
      credits: 50
    - request: Headless browser with JS rendering + residential proxy
      credits: 125
    - request: Any request to a Google domain + datacenter proxy
      credits: 10
  ai_extractor_formula: >-
    api_credit_cost = ceil((markdown_characters + output_characters) / 30)
    + web_scraping_api_request_cost
plans:
  - id: scrapingant-free
    name: Free
    type: freemium
    price: '0.00'
    currency: USD
    period: month
    credit_card_required: false
    description: >-
      10,000 API credits every month with no credit card. Renews monthly rather than being a
      one-off trial allowance.
    entries:
      - label: Monthly API credits
        name: api_credits
        type: quota
        metric: credits
        limit: 10000
        timeFrame: month
        price: '0.00'
    elements:
      - name: All API endpoints
      - name: MCP server access
      - name: Documentation
  - id: scrapingant-enthusiast
    name: Enthusiast
    type: paid
    price: '19.00'
    currency: USD
    period: month
    description: Entry paid tier, 100,000 API credits per month.
    entries:
      - label: Monthly API credits
        name: api_credits
        type: quota
        metric: credits
        limit: 100000
        timeFrame: month
        price: '19.00'
    elements:
      - name: Email support
      - name: Integration help - docs only
  - id: scrapingant-startup
    name: Startup
    type: paid
    price: '49.00'
    currency: USD
    period: month
    popular: true
    description: Provider-flagged "Most Popular" tier, 500,000 API credits per month.
    entries:
      - label: Monthly API credits
        name: api_credits
        type: quota
        metric: credits
        limit: 500000
        timeFrame: month
        price: '49.00'
    elements:
      - name: Priority email support
      - name: Custom code snippets
      - name: Expert assistance
  - id: scrapingant-business
    name: Business
    type: paid
    price: '249.00'
    currency: USD
    period: month
    description: 3,000,000 API credits per month.
    entries:
      - label: Monthly API credits
        name: api_credits
        type: quota
        metric: credits
        limit: 3000000
        timeFrame: month
        price: '249.00'
    elements:
      - name: Priority email support
      - name: Debug sessions
      - name: Expert assistance
      - name: Custom proxy pools
      - name: Custom anti-bot avoidances
      - name: Dedicated account manager
  - id: scrapingant-business-pro
    name: Business Pro
    type: paid
    price: '599.00'
    currency: USD
    period: month
    description: 8,000,000 API credits per month.
    entries:
      - label: Monthly API credits
        name: api_credits
        type: quota
        metric: credits
        limit: 8000000
        timeFrame: month
        price: '599.00'
    elements:
      - name: Priority email support
      - name: Priority debug sessions
      - name: Custom proxy pools
      - name: Custom anti-bot avoidances
      - name: Dedicated account manager
  - id: scrapingant-custom
    name: Custom
    type: enterprise
    price: '699.00'
    price_qualifier: from
    currency: USD
    period: month
    description: >-
      10M+ API credits per month, sold through sales. Listed publicly with a starting price of
      $699/mo rather than a bare "contact us".
    entries:
      - label: Monthly API credits
        name: api_credits
        type: quota
        metric: credits
        limit: 10000000
        limit_qualifier: minimum
        timeFrame: month
        price: '699.00'
    elements:
      - name: Priority + dedicated support
      - name: Full enterprise onboarding
      - name: Custom proxy pools
      - name: Custom anti-bot avoidances
      - name: Dedicated account manager
proxy_plans:
  meter: bandwidth_gb
  product: Residential proxies
  source: https://scrapingant.com/residential-proxies
  note: >-
    Standalone rotating-proxy product, billed by GB and entirely separate from the API credit
    pool. Unlimited concurrency on every tier; no per-request metering.
  tiers:
    - name: Micro
      bandwidth_gb: 5
      price_per_gb: '6.00'
      price: '30.00'
      period: month
      support: Email support
    - name: Micro+
      bandwidth_gb: 10
      price_per_gb: '5.50'
      price: '55.00'
      period: month
      support: Email support
    - name: Regular
      bandwidth_gb: 25
      price_per_gb: '5.20'
      price: '130.00'
      period: month
      support: Email support, priority support queue
    - name: Advanced
      bandwidth_gb: 50
      price_per_gb: '4.90'
      price: '245.00'
      period: month
      support: Priority support
    - name: Advanced+
      bandwidth_gb: 100
      price_per_gb: '4.50'
      price: '450.00'
      period: month
      support: Account manager
    - name: Startup
      bandwidth_gb: 250
      price_per_gb: '4.00'
      price: '1000.00'
      period: month
      support: Account manager
    - name: Business
      bandwidth_gb: 500
      price_per_gb: '3.50'
      price: '1750.00'
      period: month
      support: Account manager
    - name: Custom
      bandwidth_gb: null
      price_per_gb: null
      price: null
      period: month
      note: Higher-volume plans quoted by sales.
  datacenter_proxies:
    price_per_gb_range: '0.44-0.60'
    currency: USD
    source: https://scrapingant.com/residential-proxies
    detail_page: https://scrapingant.com/datacenter-proxies
    note: >-
      Stated as a range on the residential-proxies page; per-tier datacenter pricing was not
      read in this pass.
