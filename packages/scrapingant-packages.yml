  headline finding is decay: both language SDKs are materially behind the API they wrap. The
  JavaScript client last shipped in May 2022 and the Python client in July 2024, while the API
  gained /v2/markdown, /v2/extract, /v2/extended and a hosted MCP server after those dates -
  so neither SDK covers the endpoints ScrapingAnt now leads its marketing with. The packages
  that ARE current are the integration nodes (n8n, GitHub Action), not the SDKs.
