description: >-
  Entity model for the ScrapingAnt API. ScrapingAnt has no persistent resource graph - it
  stores nothing addressable, issues no identifiers, and exposes no CRUD. What exists is a set
  of RESPONSE SHAPES for one transient entity (a fetched page, rendered four different ways)
  plus one account-scoped metering record. There are therefore no id-reference relationships to
  derive; recording that is the finding, not a shortfall in the derivation.
graph_shape: none
persistent_resources: false
identifiers:
  scheme: none
  note: >-
    No object ids, no prefixes, no URNs. The only identifier in the whole surface is the
    caller's API key, and the only addressable thing is the caller-supplied target `url`.
