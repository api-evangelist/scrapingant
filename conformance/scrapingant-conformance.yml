domain_standard:
  applicable: false
  market: Web data extraction / scraping infrastructure
  note: >-
    REWARD-ONLY dimension, correctly left empty. The web-scraping market has no ratified
    interoperability standard - competitors (ScraperAPI, ScrapingBee, Scrapingdog, Zyte, Bright
    Data) each ship a bespoke query-parameter contract, which is precisely why ScrapingAnt
    publishes migration guides FROM three named competitors rather than a conformance claim.
    The nearest thing to an emerging standard in this market is MCP for agent access, and
    ScrapingAnt implements it - captured above as a cross-cutting conformance rather than as a
    domain standard.
  candidates_probed:
    - standard: robots.txt / RFC 9309 Robots Exclusion Protocol
      conforms: unstated
      note: >-
        The most relevant norm in this market. ScrapingAnt's product does not expose a
        robots.txt-respecting mode, and neither the docs nor the terms of use state a policy on
        honouring target-site robots directives. Recorded as unstated rather than false because
        no published document either claims or disclaims it.
