description: >-
  Cross-cutting and industry standards asserted for ScrapingAnt, each with the evidence that
  supports or refutes it. Web scraping / web-data infrastructure has no ratified domain
  standard - there is no scraping equivalent of FHIR, SCIM, OpenRTB or ISO 20022 - so
  domain_standard is recorded as not-applicable rather than as a failure. The one specification
  ScrapingAnt genuinely implements beyond OpenAPI is the Model Context Protocol, and it
  implements it well: a live, anonymously-introspectable streamable-HTTP server.
